name: Windows setup
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version (ex. 1.2.3)
        required: true
permissions:
  contents: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build tools
        run: python -m pip install setuptools==84.2.1 pyinstaller==6.22.3
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Prepare release files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v?\d+(\.\d+){1,3}$') { throw 'Version invalide' }
          New-Item -ItemType Directory release-payload | Out-Null
          git archive --format=tar --output=release-source.tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Archive impossible' }
          tar -xf release-source.tar -C release-payload
          if ($LASTEXITCODE -ne 0) { throw 'Extraction impossible' }
          Copy-Item -Recurse "$env:pythonLocation" release-payload/python
          python -m pip install --no-deps --no-build-isolation --upgrade --target release-payload/python/Lib/site-packages -r requirements-windows.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installation des dépendances dans le paquet impossible' }
          & release-payload/python/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Le verrou des dépendances est incomplet ou incohérent.' }
          & release-payload/python/python.exe -c "import fastapi, uvicorn, httpx, keyring, pypdf, PIL.Image, cryptography, websockets, ddgs, lxml.etree, webview, pynput, clr_loader"
          if ($LASTEXITCODE -ne 0) { throw 'Le Python distribué ne charge pas toutes les dépendances, notamment les extensions natives.' }
          Set-Content -Encoding ascii release-payload/VERSION $env:RELEASE_VERSION
          "RELEASE_VERSION=$($env:RELEASE_VERSION.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run tests
        shell: pwsh
        run: |
          & release-payload/python/python.exe -m unittest tests.test_api tests.test_app_releases tests.test_signed_updates tests.test_installer_config tests.test_launch_modes -v
          if ($LASTEXITCODE -ne 0) { throw 'Les tests API, versions, signatures, installation et lancement ont échoué.' }
      - name: Build ETU-AI launcher
        run: pyinstaller --onefile --noconsole --icon "$env:GITHUB_WORKSPACE/assets/etu-ai_logo.ico" --name ETU-AI --distpath release-payload --workpath .tmp/pyinstaller --specpath .tmp/pyinstaller run_launcher.py
      - name: Check signing configuration
        id: signing
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          if (($env:SIGNING_PFX -and -not $env:SIGNING_PASSWORD) -or (-not $env:SIGNING_PFX -and $env:SIGNING_PASSWORD)) { throw 'Configurez ensemble WINDOWS_SIGNING_PFX et WINDOWS_SIGNING_PASSWORD.' }
          if ($env:SIGNING_PFX) { 'enabled=true' >> $env:GITHUB_OUTPUT }
          else { 'enabled=false' >> $env:GITHUB_OUTPUT; Write-Warning 'Build sans Authenticode : Windows ne pourra pas identifier ETU-AIX comme éditeur signé et SmartScreen peut afficher un avertissement.' }
      - name: Sign application executable
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'etu-aix-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX))
          $sdkBin = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdkBin.FullName 'x64\signtool.exe'
          if (-not (Test-Path $signtool)) { throw 'SignTool introuvable' }
          & $signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $pfxPath /p $env:SIGNING_PASSWORD /d 'ETU-AI' release-payload/ETU-AI.exe
          if ($LASTEXITCODE -ne 0) { throw 'La signature de ETU-AI.exe a échoué' }
          & $signtool verify /pa /v release-payload/ETU-AI.exe
          if ($LASTEXITCODE -ne 0) { throw 'La vérification de ETU-AI.exe a échoué' }
          $signature = Get-AuthenticodeSignature release-payload/ETU-AI.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?i)etu-aix') { throw 'ETU-AI.exe ne porte pas une signature Authenticode valide pour etu-aix.' }
          Remove-Item -LiteralPath $pfxPath -Force
      - name: Build setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:RELEASE_VERSION" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compilation impossible' }
      - name: Sign setup
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'etu-aix-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX))
          $sdkBin = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdkBin.FullName 'x64\signtool.exe'
          $setup = Get-ChildItem installer/output/*.exe | Select-Object -First 1
          & $signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $pfxPath /p $env:SIGNING_PASSWORD /d 'ETU-AI Setup' $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'La signature de setup.exe a échoué' }
          & $signtool verify /pa /v $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'La vérification du setup a échoué' }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?i)etu-aix') { throw 'Le setup ne porte pas une signature Authenticode valide pour etu-aix.' }
          Remove-Item -LiteralPath $pfxPath -Force
      - name: Smoke test per-user offline package
        shell: pwsh
        run: |
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          $env:no_proxy = $env:NO_PROXY
          $setup = Get-ChildItem installer/output/*.exe | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP 'ETU-AI-offline-smoke'
          $oldOutput = Join-Path $env:RUNNER_TEMP 'ETU-AI-older-installer'
          New-Item -ItemType Directory -Force -Path $oldOutput | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc '/DAppVersion=0.0.0' "/O$oldOutput" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the previous-version installer fixture.' }
          $oldSetup = Get-ChildItem $oldOutput/ETU-AI-Setup-0.0.0.exe | Select-Object -First 1
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="' + $installRoot + '"'
          $install = Start-Process -FilePath $oldSetup.FullName -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Previous-version per-user smoke install failed: $($install.ExitCode)" }
          $python = Join-Path $installRoot 'python\python.exe'
          if (-not (Test-Path (Join-Path $installRoot 'ETU-AI.exe')) -or -not (Test-Path $python)) { throw 'The setup did not install the launcher and bundled Python.' }
          $versionFile = Join-Path $installRoot 'VERSION'
          [IO.File]::WriteAllText($versionFile, '0.0.0')
          $chatDb = Join-Path $installRoot 'storage\chats.db'
          $engineConfig = Join-Path $installRoot 'ai-server\config.json'
          $modelMarker = Join-Path $installRoot 'ai-server\models\offline-smoke.marker'
          New-Item -ItemType Directory -Force -Path @((Split-Path $chatDb), (Split-Path $modelMarker)) | Out-Null
          $env:SMOKE_CHAT_DB = $chatDb
          & $python -c "import os,sqlite3; db=sqlite3.connect(os.environ['SMOKE_CHAT_DB']); db.execute('CREATE TABLE smoke (value TEXT)'); db.execute('INSERT INTO smoke VALUES (?)', ('existing-chat-data',)); db.commit(); db.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the SQLite data-preservation fixture.' }
          [IO.File]::WriteAllText($engineConfig, '{"beacon_port":12567}')
          [IO.File]::WriteAllText($modelMarker, 'existing-model-data')
          $upgrade = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade from the previous version failed: $($upgrade.ExitCode)" }
          & $python -c "import os,sqlite3; db=sqlite3.connect(os.environ['SMOKE_CHAT_DB']); assert db.execute('SELECT value FROM smoke').fetchone()[0] == 'existing-chat-data'; db.close()"
          if ($LASTEXITCODE -ne 0 -or (Get-Content -Raw $engineConfig) -ne '{"beacon_port":12567}' -or [IO.File]::ReadAllText($modelMarker) -ne 'existing-model-data' -or (Get-Content -Raw $versionFile).Trim() -ne $env:RELEASE_VERSION) { throw 'The previous-version update changed user data, engine configuration, models, or failed to update the version.' }
          $env:PATH = Join-Path $env:SystemRoot 'System32'
          Push-Location $installRoot
          try {
            & $python -m pip check
            if ($LASTEXITCODE -ne 0) { throw 'The installed offline Python environment is incomplete.' }
            & $python -c "import api_server, fastapi, cryptography, webview, pynput; from integration.updates import installed_version; assert installed_version().removeprefix('v') == '$env:RELEASE_VERSION'; assert api_server._packaged_windows_install()"
            if ($LASTEXITCODE -ne 0) { throw 'The installed app cannot import its runtime or enable direct updates without an external Python on PATH.' }
          } finally { Pop-Location }
          $launcherPath = Join-Path $installRoot 'ETU-AI.exe'
          $launcher = $null
          $serverPid = 0
          try {
            $launcher = Start-Process -FilePath $launcherPath -ArgumentList @('--mode', 'local') -WorkingDirectory $installRoot -WindowStyle Hidden -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $ready = $false
            do {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:8900/api/status' -TimeoutSec 3
                if ($status.status -eq 'online') { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $ready) { throw 'ETU-AI.exe did not start the local app with external network access blocked.' }
            $launchMode = Invoke-RestMethod -Uri 'http://127.0.0.1:8900/api/launch-mode' -TimeoutSec 3
            $serverPid = [int]$launchMode.pid
            & $python -c "import os,sqlite3; db=sqlite3.connect(os.environ['SMOKE_CHAT_DB']); assert db.execute('SELECT value FROM smoke').fetchone()[0] == 'existing-chat-data'; db.close()"
            if ($LASTEXITCODE -ne 0) { throw 'The app did not preserve its existing SQLite conversation data on startup.' }
            Invoke-RestMethod -Uri 'http://127.0.0.1:8900/api/power/shutdown' -Method Post -Headers @{ Origin = 'http://127.0.0.1:8900' } -TimeoutSec 5 | Out-Null
          } finally {
            if ($serverPid -le 0) {
              try { $serverPid = [int](Invoke-RestMethod -Uri 'http://127.0.0.1:8900/api/launch-mode' -TimeoutSec 2).pid } catch { }
            }
            if ($serverPid -gt 0) {
              $serverProcess = Get-Process -Id $serverPid -ErrorAction SilentlyContinue
              if ($serverProcess -and -not $serverProcess.WaitForExit(10000)) { Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue }
            }
            if ($launcher -and (Get-Process -Id $launcher.Id -ErrorAction SilentlyContinue)) {
              try { & taskkill.exe /PID $launcher.Id /T /F 2>$null | Out-Null } catch { }
            }
          }
      - name: Check Ed25519 release key
        id: ed25519
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw 'Build refusé : configurez RELEASE_SIGNING_PRIVATE_KEY (clé privée Ed25519 PEM encodée en base64) pour signer chaque manifeste.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'etu-release-signing-check.pem'
          try {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:RELEASE_SIGNING_KEY))
            & release-payload/python/python.exe tools/sign_release.py --check-key --private-key $keyPath
            if ($LASTEXITCODE -ne 0) { throw 'La clé privée Ed25519 ne correspond pas à une clé publique intégrée au client.' }
            'enabled=true' >> $env:GITHUB_OUTPUT
          } finally { Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue }
      - name: Sign update manifest
        if: ${{ steps.ed25519.outputs.enabled == 'true' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'etu-release-signing.pem'
          try {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:RELEASE_SIGNING_KEY))
            $setup = Get-ChildItem installer/output/*.exe | Select-Object -First 1
            $version = if ($env:RELEASE_TAG.StartsWith('v')) { $env:RELEASE_TAG } else { "v$($env:RELEASE_TAG)" }
            $url = "https://github.com/etu-aix/ETU-AI/releases/download/$version/$($setup.Name)"
            & release-payload/python/python.exe tools/sign_release.py --package $setup.FullName --version $version --url $url --platform windows --private-key $keyPath --output "$($setup.FullName).manifest.json"
            if ($LASTEXITCODE -ne 0) { throw 'La signature du manifeste de mise à jour a échoué' }
          } finally { Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue }
          $authenticodeStatus = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { 'Signed and verified with the etu-aix Authenticode certificate.' } else { 'NOT SIGNED. Windows cannot identify ETU-AIX as a signed publisher; SmartScreen may show a warning.' }
          @"
          ETU-AI Windows release signature status
          Authenticode: $authenticodeStatus
          Ed25519 manifest: Signed and verified by the client key ring.
          "@ | Set-Content -Encoding utf8 (Join-Path (Split-Path $setup.FullName) "ETU-AI-Setup-$($env:RELEASE_TAG.TrimStart('v')).signature-status.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: ETU-AI-Setup
          path: installer/output/*
      - name: Attach setup to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" installer/output/* --clobber
